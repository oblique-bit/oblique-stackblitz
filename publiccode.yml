description:
  en:
    localisedName: Oblique Stackblitz
    shortDescription: "StackBlitz examples for Oblique features not covered in the
      main docs and a ready-to-use bug reproduction template "
    longDescription: >-
      This repository serves two purposes:


      It hosts live StackBlitz examples showcasing Oblique features that are not
      covered in the main documentation, allowing users to explore and
      experiment in a hands-on environment.


      It provides a bug report template — an empty StackBlitz project with
      Oblique pre-installed — that can be used to reproduce and report issues
      for any feature of the library.


      The Oblique team maintains the base setup and keeps dependencies up to
      date. This repository complements the official documentation by offering
      interactive demonstrations and a standardized environment for reporting
      bugs across all features.
    features:
      - Examples of Oblique features
