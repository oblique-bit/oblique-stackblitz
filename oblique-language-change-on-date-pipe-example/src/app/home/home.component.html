<p>Change the language in the top right corner to see the date format change.</p>

<h3>Now from date object:</h3>
<p>{{ now | obDate: 'longDate' }}</p>

<h3>Now from date object with time:</h3>
<p>{{ now | obDate: 'longDate' : 'mediumTime' }}</p>

<h3>From date string:</h3>
<p>{{ '22-02-2022' | obDate: 'longDate' }}</p>
